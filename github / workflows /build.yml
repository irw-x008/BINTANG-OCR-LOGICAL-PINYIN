name: Build BINTANG OCR (.exe)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./bintang_ocr

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            %LOCALAPPDATA%\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('bintang_ocr/requirements.txt') }}-py3.8
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies and Nuitka
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install nuitka

      - name: Compile with Nuitka (onefile .exe)
        run: |
          python -m nuitka --onefile --windows-disable-console --output-dir=build main.py

      - name: Show build output (for debugging)
        run: |
          dir build

      - name: Upload artifact (zip) - BINTANG-OCR-PRO
        uses: actions/upload-artifact@v4
        with:
          name: BINTANG-OCR-PRO
          path: build\main.exe
